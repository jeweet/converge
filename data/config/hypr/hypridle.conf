# Converge: idle behaviour in desktop mode (packaged default).
# Override: copy to ~/.config/converge/hypr/hypridle.conf
#
# Lock after 10 minutes, screens off after 15. Suspend stays blocked while
# docked (BLOCK_SUSPEND).

general {
    lock_cmd = /usr/libexec/converge/desktop lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 minutes: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 minutes: screens off, back on when you move
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
