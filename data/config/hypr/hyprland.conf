# Converge: Hyprland config for desktop mode (packaged default).
# Do not edit this file: it is replaced on updates. Put your own changes in
# ~/.config/hypr/hyprland.conf, below the line that sources this file.

# --- Displays ---------------------------------------------------------
# External display at its preferred mode. Per-display scale and resolution
# come from the Converge app (see the generated file at the end).
monitor = , preferred, auto, 1

# --- Cursor -----------------------------------------------------------
# The regular Adwaita cursor (same as in Phosh/GNOME apps)
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

# --- Startup ----------------------------------------------------------
exec-once = hyprctl setcursor Adwaita 24
# Lock right away: logging in automatically when docking must not mean
# anyone can get in
exec-once = /usr/libexec/converge/desktop lock
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11
# Notifications and notification center with quick settings (Super+N)
exec-once = /usr/libexec/converge/desktop notifications
# Top bar
exec-once = /usr/libexec/converge/desktop bar
# Same wallpaper as Phosh (org.gnome.desktop.background)
exec-once = /usr/libexec/converge/wallpaper
# Desktop mode: audio to the display, no suspend, battery warnings, touchpad
exec-once = /usr/libexec/converge/desktop start
# Lock and blank the screen when idle
exec-once = /usr/libexec/converge/desktop idle
# Pass the environment to systemd/D-Bus and start the session target. It
# activates graphical-session.target (needed for xdg-desktop-portal) and
# pulls in xdg-desktop-autostart.target: all XDG autostart programs (Calls,
# Chatty, ...), just like gnome-session does under Phosh.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start converge-hyprland-session.target; systemctl --user restart xdg-desktop-portal; systemctl --user restart xdg-desktop-portal-hyprland

# --- Programs ---------------------------------------------------------
$terminal = kgx
$menu = /usr/libexec/converge/desktop launcher
$mod = SUPER

# --- Input ------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
}

# --- Look (kept light for the phone GPU) --------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    # Resize windows by dragging their edges with the mouse
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 8
        passes = 2
    }
    shadow {
        enabled = false
    }
}

# App launcher: blur behind the panel only, not the transparent area
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.3

animations {
    enabled = true
    bezier = quick, 0.2, 0.9, 0.1, 1.0
    animation = windows, 1, 3, quick
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, quick
}

cursor {
    # Keep the pointer visible while using the phone touchpad
    hide_on_touch = false
    # Software cursor: the hardware cursor flickers/disappears with the
    # legacy KMS path (HYPRLAND_NO_ATOMIC)
    no_hardware_cursors = 1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    font_family = Adwaita Sans
}

# --- Key bindings -----------------------------------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, R, exec, $menu
bind = $mod, D, exec, $menu
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, /usr/libexec/converge/desktop lock
bind = $mod, N, exec, swaync-client -t -sw
# Phone screen as touchpad + keyboard
bind = $mod, T, exec, /usr/libexec/converge/desktop touchpad toggle
# Leave desktop mode: back to the phone
bind = $mod SHIFT, E, exit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Media keys (Bluetooth/USB keyboards)
bindel = , XF86AudioRaiseVolume, exec, /usr/libexec/converge/desktop volume up
bindel = , XF86AudioLowerVolume, exec, /usr/libexec/converge/desktop volume down
bindl = , XF86AudioMute, exec, /usr/libexec/converge/desktop volume mute
bindl = , XF86AudioMicMute, exec, /usr/libexec/converge/desktop volume mic-mute
bindel = , XF86MonBrightnessUp, exec, /usr/libexec/converge/desktop brightness up
bindel = , XF86MonBrightnessDown, exec, /usr/libexec/converge/desktop brightness down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
# Screenshots, like GNOME: Print = area, Shift+Print = screen, Alt+Print = window
bind = , Print, exec, /usr/libexec/converge/desktop screenshot area
bind = SHIFT, Print, exec, /usr/libexec/converge/desktop screenshot screen
bind = ALT, Print, exec, /usr/libexec/converge/desktop screenshot window
bindl = , XF86AudioPrev, exec, playerctl previous

# Move/resize windows with the mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Generated --------------------------------------------------------
# Written by converge at the start of desktop mode: phone screen on (as
# touchpad) or off, touchscreen mapping, the display profile from the
# Converge app, the keyboard layouts and the accent color from GNOME.
# Sourced last, so it overrides the defaults above.
source = ~/.local/state/converge/hyprland-generated.conf
