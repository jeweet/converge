# Converge: GNOME-style lock screen (packaged default).
# Override: copy to ~/.config/converge/hypr/hyprlock.conf
# The background is a link to your wallpaper, made by converge wallpaper.

general {
    hide_cursor = false
}

background {
    path = ~/.cache/converge/background
    color = rgba(000000ff)
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Date above the clock
label {
    text = cmd[update:60000] date +"%A %-d %B"
    font_family = Adwaita Sans
    font_size = 22
    color = rgba(ffffffee)
    position = 0, 230
    halign = center
    valign = center
}

# Large clock
label {
    text = $TIME
    font_family = Adwaita Sans Bold
    font_size = 96
    color = rgba(ffffffff)
    position = 0, 140
    halign = center
    valign = center
}

# Pill-shaped password field, like GNOME
input-field {
    size = 280, 46
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(ffffff26)
    font_color = rgba(ffffffff)
    font_family = Adwaita Sans
    check_color = rgba(3584e4ff)
    fail_color = rgba(ff7b63ff)
    fail_text = Wrong PIN
    placeholder_text = <span foreground="##ffffffaa">PIN</span>
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
