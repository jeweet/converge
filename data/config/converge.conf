# ~/.config/converge/converge.conf - your settings for desktop mode
# Most settings can also be changed in the Converge app.
# Changes take effect the next time you dock.

# Keep the phone screen on as a touchpad + keyboard (Super+T toggles it)
PHONE_TOUCHPAD=0

# Send audio to the external display (DisplayPort/HDMI audio) while docked
AUDIO_TO_DISPLAY=1

# Block suspend while docked (locking and screen blanking still happen)
BLOCK_SUSPEND=1

# GTK titlebar buttons, per session (GNOME button-layout syntax)
TITLEBAR_DESKTOP="appmenu:close"
TITLEBAR_PHOSH="appmenu:"

# Notify when the battery drops to these percentages while docked.
# Empty ("") disables it. 10% and lower are critical notifications.
BATTERY_WARNINGS="30 20 10 5"

# NetworkManager connection used by the VPN toggle and bar icon.
# Empty = the first WireGuard/VPN connection.
VPN_CONNECTION=""

# Connector of the built-in display. Empty = detect (DSI-*/eDP-*).
INTERNAL_DISPLAY=""
