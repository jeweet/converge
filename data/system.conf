# /etc/converge.conf - system settings for Converge
# Changes take effect the next time you dock.

# User that is logged in automatically when docking/undocking.
# Empty = the postmarketOS default user (uid 10000) or the first regular user.
# "converge setup" fills this in for you.
CONVERGE_USER=""

# Seconds the "Switch to desktop mode?" notification stays up
PROMPT_TIMEOUT=60

# Set the CPU governor to "performance" while docked (1 = on, 0 = off)
PERFORMANCE=1

# If Hyprland exits within this many seconds after starting, it counts as a
# crash and the phone goes back to Phosh (safety net)
CRASH_SECONDS=20

# Use the legacy (non-atomic) KMS path in Hyprland. Needed on the Fairphone 5,
# whose DisplayPort output has no DSPP block ("unable to find appropriate
# mixers"). Set to 0 on devices where atomic modesetting works.
HYPRLAND_NO_ATOMIC=1
